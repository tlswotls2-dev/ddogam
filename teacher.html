<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>또감 - 교사 대시보드</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
  /* [한글 주석] 헤더 공통 */
  .dashboard-header {
    flex-wrap: nowrap !important;
  }
  .dashboard-title {
    white-space: nowrap !important;
    flex-shrink: 0 !important;
    font-size: 1.1rem !important;
  }
  .dashboard-header-actions {
    flex-wrap: nowrap !important;
    flex-shrink: 0 !important;
    gap: 6px !important;
  }
  .dashboard-btn,
  .dashboard-refresh-btn,
  .dashboard-logout-btn {
    white-space: nowrap !important;
    font-size: 12px !important;
    padding: 6px 10px !important;
  }

  /* [한글 주석] 학생 그리드 기본 리셋 - style.css 오버라이드 */
  .dashboard-student-grid {
    max-width: 100% !important;
    width: 100% !important;
    box-sizing: border-box !important;
    grid-template-columns: repeat(2, 1fr) !important;
    padding: 0 12px !important;
  }

  @media (min-width: 900px) {
    .dashboard-student-grid {
      grid-template-columns: repeat(3, 1fr) !important;
      padding: 0 16px !important;
    }
  }

  @media (min-width: 1280px) {
    .dashboard-student-grid {
      grid-template-columns: repeat(5, 1fr) !important;
      padding: 0 20px !important;
    }
  }
</style>
<script>
(function applyDashboardLayout() {
  function apply() {
    const w = window.innerWidth;
    const style = document.getElementById('dashboard-responsive-style') || document.createElement('style');
    style.id = 'dashboard-responsive-style';

    if (w <= 900) {
      // [한글 주석] 태블릿
      style.textContent = `
        .dashboard-header { padding: 10px 12px !important; gap: 6px !important; }
        .dashboard-title { font-size: 0.85rem !important; }
        .dashboard-btn, .dashboard-refresh-btn, .dashboard-logout-btn {
          font-size: 10px !important; padding: 4px 7px !important;
        }
        .dashboard-stats-row { grid-template-columns: repeat(3, 1fr) !important; padding: 8px !important; gap: 6px !important; }
        .dashboard-student-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; padding: 0 8px !important; max-width: 100% !important; }
        .stat-label { font-size: 0.58rem !important; white-space: nowrap !important; }
        .stat-value { font-size: 0.78rem !important; }
        .stat-icon { font-size: 1.1rem !important; }
        .dsc-name { font-size: 0.82rem !important; }
        .dsc-number { font-size: 0.68rem !important; padding: 2px 6px !important; }
        .dsc-reward-btn { font-size: 0.68rem !important; padding: 4px !important; }
        .dashboard-student-card { padding: 8px !important; }
      `;
    } else if (w <= 1280) {
      // [한글 주석] 노트북
      style.textContent = `
        .dashboard-stats-row { grid-template-columns: repeat(5, 1fr) !important; }
        .dashboard-student-grid { grid-template-columns: repeat(3, 1fr) !important; max-width: 100% !important; padding: 0 16px !important; }
      `;
    } else {
      // [한글 주석] 데스크탑
      style.textContent = `
        .dashboard-stats-row { grid-template-columns: repeat(5, 1fr) !important; }
        .dashboard-student-grid { grid-template-columns: repeat(5, 1fr) !important; max-width: 100% !important; }
      `;
    }
    if (!document.getElementById('dashboard-responsive-style')) {
      document.head.appendChild(style);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', apply);
  } else {
    apply();
  }
  window.addEventListener('resize', apply);
})();
</script>
</head>

<body>

  <!-- [한글 주석] 📊 선생님 전용 대시보드 화면 (PC 최적화) -->
  <div id="teacher-dashboard-screen" class="teacher-dashboard-screen">
    <!-- 상단 헤더 바 -->
    <div class="dashboard-header">
      <h1 id="dashboard-title" class="dashboard-title" style="white-space:nowrap;font-size:1.1rem;">📊 또감 대시보드</h1>
      <div class="dashboard-header-actions">
        <button onclick="showBulkRewardModal()" style="
                  background: linear-gradient(135deg, #ff9500, #ff6b00);
                  color: #fff;
                  border: none;
                  border-radius: 8px;
                  padding: 6px 10px;
                  font-size: 12px;
                  font-weight: 700;
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  gap: 4px;
                  white-space: nowrap;
                ">🎁 전체 선물하기</button>
        <button class="dashboard-btn dashboard-refresh-btn" onclick="refreshDashboard()" style="white-space:nowrap;font-size:12px;padding:6px 10px;">🔄 새로고침</button>
        <button class="dashboard-btn dashboard-logout-btn" onclick="teacherLogout()" style="white-space:nowrap;font-size:12px;padding:6px 10px;">🚪 로그아웃</button>
        <button onclick="showTeacherHelp()" style="
          background:rgba(74,158,255,0.15);
          color:#7aabff;
          border:1px solid #4a6fa5;
          border-radius:8px;
          padding:6px 10px;
          font-size:12px;
          font-weight:700;
          cursor:pointer;
          display:flex;
          align-items:center;
          gap:4px;
          white-space:nowrap;
        ">❓ 도움말</button>
      </div>
    </div>

    <!-- 대시보드 상단 통계 카드 5개 -->
    <div class="dashboard-stats-row">
      <div class="dashboard-stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-label">참여 학생</div>
        <div class="stat-value" id="stat-student-count">0명</div>
      </div>
      <div class="dashboard-stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-label">평균 수집</div>
        <div class="stat-value" id="stat-avg-collect">0개</div>
      </div>
      <div class="dashboard-stat-card">
        <div class="stat-icon">🏆</div>
        <div class="stat-label">최다 수집</div>
        <div class="stat-value" id="stat-top-student">-</div>
      </div>
      <div class="dashboard-stat-card">
        <div class="stat-icon">🖥️</div>
        <div class="stat-label">오늘 접속</div>
        <div class="stat-value" id="stat-today-active">0명</div>
      </div>
      <div class="dashboard-stat-card">
        <div class="stat-icon">📗</div>
        <div class="stat-label">오늘 매우잘함</div>
        <div class="stat-value" id="stat-today-great">0명</div>
      </div>
    </div>

    <!-- 학생 목록 그리드 -->
    <div class="dashboard-student-grid" id="dashboard-student-grid"></div>
  </div>

  <script src="js/teacher.js"></script>
  <script src="js/demo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // [한글 주석] 대시보드 초기화 (실제 데이터 or 샘플 데이터)
      if (typeof initDashboard === 'function') {
        initDashboard();
      }

      // [한글 주석] 체험 모드 배너 표시
      if (localStorage.getItem('demoMode') === 'true') {
        setTimeout(function () {
          if (typeof showDemoBanner === 'function') showDemoBanner();
        }, 600);
      }
    });
  </script>
</body>

</html>
